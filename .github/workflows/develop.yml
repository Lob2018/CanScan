name: Test and SonarQube Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test_and_analyze:
    name: Test and SonarQube Analysis
    runs-on: windows-latest
    permissions:
      contents: read      # Pour l'analyse du code
      pull-requests: read # Requis pour que SonarQube puisse commenter/analyser les PR
    environment: production

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'liberica'
          java-version: '25'
          cache: 'maven'

      - name: Set Java Options
        shell: pwsh
        run: |
          echo "JAVA_TOOL_OPTIONS=-Duser.language=fr -Duser.country=FR -Duser.region=FR -Djava.awt.headless=false -Dsun.awt.disablegrab=true" >> $env:GITHUB_ENV

      - name: Compile, Test, and analyze with Maven profile
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          .\mvnw.cmd -B test -f pom.xml
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar ^
          -Dsonar.projectKey=Lob2018_CanScan ^
          -Dsonar.qualitygate.wait=true ^
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
