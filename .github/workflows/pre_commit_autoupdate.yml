name: Pre-commit autoupdate check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  checks: write
  contents: read

jobs:
  precommit_autoupdate:
    name: Pre-commit Autoupdate
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: 'pip'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Check pre-commit version
        run: python -m pre_commit --version
      - name: Run pre-commit autoupdate and check for changes
        run: |
          python -m pre_commit autoupdate
          git diff --exit-code .pre-commit-config.yaml
