name: Pre-commit autoupdate check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  checks: write
  contents: read

jobs:
  precommit_autoupdate:
    name: Pre-commit Autoupdate
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip==26.1
          python -m pip install --only-binary=:all: pre-commit==4.6.0

      - name: Check pre-commit version
        run: python -m pre_commit --version

      - name: Run pre-commit autoupdate and check for changes
        run: |
          python -m pre_commit autoupdate
          git diff --exit-code .pre-commit-config.yaml
