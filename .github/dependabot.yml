version: 2
updates:
  # 1. Surveillance des dépendances Java (Maven)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # Regrouper les mises à jour pour éviter de multiplier les commits individuels
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # 2. Surveillance des GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # 3. Surveillance des hooks pre-commit (.pre-commit-config.yaml)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # 4. Surveillance des dépendances Python (manifestes standards)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
